<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Localiser</title>
  <meta name="description" content="Suivi en temps réel de la position des enfants, pour la famille.">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Localiser">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="map" aria-label="Carte"></div>

    <header id="topbar" hidden>
      <button class="icon-btn" id="btn-menu" aria-label="Famille et réglages">☰</button>
      <div class="topbar-title">
        <strong id="family-name">Localiser</strong>
        <span id="live-status" class="live-status"></span>
      </div>
      <button class="icon-btn" id="btn-alerts" aria-label="Alertes">🔔<span id="alerts-badge" class="badge" hidden></span></button>
    </header>

    <section id="sheet" class="sheet" hidden>
      <div class="sheet-handle"></div>
      <ul id="children-list" class="children-list"></ul>
      <p id="children-empty" class="muted center" hidden>Aucun enfant pour l'instant.<br>Ajoutez-en un depuis le menu ☰.</p>
    </section>

    <!-- Barre d'historique -->
    <section id="history-bar" class="floating-panel" hidden>
      <div class="row space">
        <strong id="history-title">Historique</strong>
        <button class="icon-btn small" id="history-close" aria-label="Fermer l'historique">✕</button>
      </div>
      <div id="history-days" class="chips"></div>
      <p id="history-summary" class="muted small"></p>
    </section>

    <!-- Placement d'une zone -->
    <div id="crosshair" hidden>＋</div>
    <section id="zone-bar" class="floating-panel" hidden>
      <strong>Nouvelle zone</strong>
      <p class="muted small">Déplacez la carte pour placer le centre de la zone sous la croix.</p>
      <label>Nom <input id="zone-name" maxlength="30" placeholder="Maison, École…"></label>
      <label>Rayon : <span id="zone-radius-label">150 m</span>
        <input id="zone-radius" type="range" min="50" max="1000" step="25" value="150">
      </label>
      <div class="row gap">
        <button class="btn ghost" id="zone-cancel">Annuler</button>
        <button class="btn" id="zone-save">Enregistrer</button>
      </div>
    </section>

    <!-- Pages plein écran -->
    <section id="page" class="page" hidden>
      <header class="page-head">
        <button class="icon-btn" id="page-back" aria-label="Retour">←</button>
        <h1 id="page-title"></h1>
      </header>
      <div id="page-body" class="page-body"></div>
    </section>

    <div id="toasts" aria-live="polite"></div>
  </div>

  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
